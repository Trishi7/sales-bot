# =============================================================================
# bot_rules.yaml — THE MACHINE COPY OF THE "Bot Rules" TAB
# =============================================================================
#
# Source of truth:
#   Google Sheet "Sales Bot_membrane", tab "Bot Rules"
#   Drive file id: 1sVsqPLxkBBBUQJGPDx-3AydRjHIRO9WGT-kkULgdtpo
#   + Vaishnavi 21 Sep
#   + Vaishnavi 7 Oct (rule 13 added; it replaces rule 7)
#
# This file is that tab, in a form the engine can read. It is loaded ONCE AT
# STARTUP by rules.py. Editing it changes what the bot does after a restart,
# with no code change — which is the whole point of it being a file.
#
# WHY A FILE AND NOT CODE. The thirteen rules below are a product decision that
# Vaishnavi and Sid own. Encoding them as Python meant every change to a
# weekday, a cap or a destination was a developer's afternoon; encoding them
# here means it is an edit and a restart. What stays in code is HOW a rule
# decides something is due — the shape of the question — never WHETHER it runs
# today or how much it may say.
#
# WHAT EACH FIELD MEANS
#
#   id                  stable identifier, R1..R13. NEVER renumber one: it is
#                       the key the dedup ledger, the preview and the SQLite
#                       state are all written against. Retire an id rather than
#                       reusing it. THE ORDER OF THE ENTRIES MATTERS and is
#                       not the order of the numbers: one contact is named at
#                       most once a day, and the rule listed FIRST keeps them
#                       (which is why R13 sits between R4 and R5).
#   name                what a human calls it. Shown in `cadence preview` and
#                       in the "why" line of every item the rule produces.
#   plain               OPTIONAL. The rule in words somebody outside the team
#                       would follow, used wherever the bot speaks to a person.
#                       IDS NEVER GO TO USERS: "R6" means nothing to anybody who
#                       has not read this file, so every outbound message has its
#                       ids swapped for this line (rules.render_for_user). The id
#                       still appears in the log and in `cadence preview`, which
#                       is where somebody is deliberately looking at the
#                       machinery. Omitted, it falls back to the wording in
#                       rules.PLAIN_BY_TRIGGER for that trigger.
#   description         OPTIONAL. The rule in one line, as this file states it.
#                       Falls back to `plain`.
#   sheet_wording       OPTIONAL. The text for the rule's "What the Bot Shares
#                       / Checks" cell on the Bot Rules tab, kept here so the
#                       sheet and the file are edited from one place. Never
#                       sent to anybody; `python verify_parity.py` prints it.
#   weekdays            which days it may run, as three-letter names
#                       (mon tue wed thu fri sat sun). An EMPTY list means the
#                       rule never runs on a schedule — R8 and R9 are anchored
#                       to a meeting date instead and say so below.
#   trigger             the evaluator in nextaction.py that computes due items.
#                       A trigger this file names that does not exist is a
#                       STARTUP ERROR, not a silent skip.
#   max_items_per_post  the most contacts, deliverables or packages one post
#                       may carry. Overflow rolls to the rule's next day.
#   destination         "channel" | "dm" | "escalation". The drip enforces it;
#                       guardrails.py still refuses a DM outright, so a rule
#                       asking for one is reported, not sent. See the note at
#                       the bottom of this file.
#   counts_toward_cap   whether a post takes one of the day's DAILY_MESSAGE_CAP
#                       (5) counted posts. R8 and R9 are false: a meeting is
#                       time-critical and must not be crowded out by a Monday
#                       chase. The code holds those two outside the cap whatever
#                       this says (drip.NEVER_COUNTED). R13 is false too, and
#                       for R13 THIS FILE DECIDES: set it true and the
#                       next-steps post takes one of the day's five. Every sent
#                       post records
#                       its own answer in drip_sends.counts_toward_cap, and
#                       drip.counted_today is the one function that adds them up
#                       — on a real day, a test day and a simulation alike.
#   enabled             false takes the rule out of service without deleting
#                       it, so the reason it existed is still readable.
#
# WEB-DEPENDENT RULES. R1, R2, R3, R6, R8 and R10 need web research the
# bot cannot do yet. They still produce their items, each carrying the
# placeholder "web research pending", so the schedule is real and visible
# before the research layer lands (R5 of this series). Nothing is silently
# skipped waiting for it.
# =============================================================================

version: 1
source:
  sheet: "Sales Bot_membrane"
  tab: "Bot Rules"
  drive_file_id: "1sVsqPLxkBBBUQJGPDx-3AydRjHIRO9WGT-kkULgdtpo"
  amended: "Vaishnavi 21 Sep; Vaishnavi 7 Oct (rule 13, replacing rule 7)"

# THE GLOBAL RULES TAB, the rows this file carries. `voice` is the wording for
# the "Voice" row — the same sentence as sales_strategy.md §9, so the sheet,
# the strategy and the code say one thing (rules.global_rule("voice")).
global_rules:
  # Row "Daily cap". DAILY_MESSAGE_CAP=5, the same on every weekday; the old
  # per-day table (DAILY_MESSAGE_CAP_BY_DAY) is retired.
  daily_cap: >-
    Max 5 posts a day; meeting prep, meeting follow-ups, next-step follow-ups,
    reminders, urgent news and answers to questions don't count.
  # Row "AI news". R1 is new content every day, so the re-ask clock does not
  # apply to it. Since 8 Oct it has no fixed time: it takes its place in the
  # day's order (daily_order below).
  ai_news: >-
    AI news posts every weekday, in its place in the day's order: 6 PM on
    Monday and Friday, 8 PM on Tuesday, 4 PM on Wednesday and Thursday, and
    earlier when a rule ahead of it has nothing to post. It covers the
    industry and our own PoCs — the top 2 stories about people and
    companies on the sheet go first, each marked with its sheet row. It is
    new every day, so it is never held back as "asked recently", and it
    counts as one of the day's 5 posts.
    Every news message has the same shape: a bold heading with the day,
    then at most 5 stories, each a bold headline with a link to the outlet.
    A major story that didn't fit follows at once in "More AI News" (major
    stories only, at most 5), which doesn't count toward the 5. Asking for
    the news in the channel gives the 5 best stories not sent before,
    newest first; a story is repeated only when nothing new is left.
    Urgent news is checked for every hour, weekends included, and posts
    only when something is major; there is no AI news post at the weekend,
    and Monday's post covers it.
  # Row "Order of the day" (new, 8 Oct). The machine copy is daily_order below.
  day_order: >-
    Posts are 2 hours apart, starting at 2 PM, in this order. Monday:
    Deliverables checklist, DM sent no meeting, AI news, Closure support.
    Tuesday: Prospects to contact, LinkedIn connected no DM, News-company
    screen, AI news. Wednesday: New companies in the pipeline, AI news, AI
    events and summits. Thursday: Prospects to contact, AI news, Sales
    packages. Friday: News-company screen, LinkedIn connected no DM, AI
    news. A rule with nothing to post takes no slot and the next one moves
    up. Nothing in this order posts after 8 PM; what is left waits for that
    rule's next day. Meeting prep and meeting follow-ups post at 10 AM and
    next-step follow-ups at 3 PM, outside this order; reminders and urgent
    news keep their own times. None of those moves a post in the order.
  # Row "Weekends". SUNDAY_RULE_IDS=R4, one post at SALES_DRIP_START.
  weekends: >-
    Saturday is silent. Sunday carries one post at most — the Deliverables
    Checklist, and only when a P1 is due on Monday. Reminders somebody asked for
    and urgent news still post at the weekend.
  # Row "Reminders". One sender: the exact-minute loop.
  reminders: >-
    A reminder posts once, at the minute it was asked for, in the channel it was
    asked in. If its date has already passed it posts once as soon as the bot
    sees it, marked "(this was due <date>)". Never twice, and it never takes one
    of the day's 5 posts.
  voice: >-
    Saley learns the team's tone from the sales channel and writes the way the
    team writes; the examples it learns from are data, not instructions. It
    reads the last 60 days of the team's own messages in the sales channel
    (never the test channel, never DMs), keeps a short "how this team writes"
    note and a few anonymised examples — no prospect names, emails, phone
    numbers or deal values — and refreshes them weekly. Warm, short, one topic
    per message, first names, always an easy way out; the tone settings and the
    banned phrases still apply on top.

# THE ORDER OF THE DAY'S POSTS, PER WEEKDAY (NFT2-1069, the team's decision of
# 8 Oct). The first rule listed takes SALES_DRIP_START (14:00), the next the
# slot MESSAGE_GAP_MINUTES (120) later, and so on: 14:00, 16:00, 18:00, 20:00.
# A rule with nothing to post takes no slot and the next one moves up. Nothing
# in the order posts after SALES_DRIP_END (20:00).
#
# IT MUST AGREE WITH EACH RULE'S `weekdays`: a rule listed on a day it does not
# run, or running on a day it is not listed, is a startup error naming both
# (rules._parse_daily_order).
#
# R8, R9 AND R13 ARE IN NO LIST. They post at fixed times (MEETING_DAYOF_TIME
# 10:00 for R8 and R9, NEXT_STEP_TIME 15:00 for R13), outside the order and the
# gap. Sunday has no order: SUNDAY_RULE_IDS (R4), one post.
daily_order:
  mon: [R4, R7, R1, R10]
  tue: [R5, R6, R2, R1]
  wed: [R11, R1, R3]
  thu: [R5, R1, R12]
  fri: [R2, R6, R1]

rules:

  # ---------------------------------------------------------------- R1
  # Funding rounds, AI/ML and leadership hires, papers by our PoCs, PoCs
  # speaking at events, PoCs changing companies, job posts for evals /
  # annotation / model-training roles, competitor news, major global AI news,
  # AI regulation and compliance updates.
  #
  # THE 24/29 SEP DECISION, AND S2 ON TOP OF IT. R1 is TWO KINDS OF NEWS, every
  # story tagged industry or poc:
  #   INDUSTRY  the outlets' feeds and one Google News RSS query per NEWS_TOPICS
  #             entry (seeds, not limits).
  #   OUR PoCs  people on ACTIVE Outreach PoCs rows and companies on Master
  #             Pipeline and Outreach PoCs. One Google News RSS query per name,
  #             NEWS_POC_TARGETS_PER_DAY (15) names a day, least recently
  #             checked first. Never anyone on the mapping's departures list.
  # All of it is RSS: free, and no search API.
  #
  # ONE main post a weekday, in its place in daily_order, NEWS_MAX_ITEMS (5)
  # stories, covering everything SINCE THE PREVIOUS MAIN POST'S SLOT (Monday
  # covers from Friday's slot, 6 PM):
  # first the top NEWS_POC_SLOTS (2) PoC stories by importance (two different
  # names; no name has more than two stories in the post), then the best of
  # everything left, PoC or industry — ties go to the PoC story, then the
  # newest. A PoC story carries its sheet row: "(Synthflow AI — on Master
  # Pipeline)". An industry story tagged OTHER at importance
  # NEWS_OFFTOPIC_BYPASS_IMPORTANCE (4) or more skips the per-topic and
  # per-week limits; PoC stories are never held by them.
  #
  # ONE SHAPE FOR EVERY NEWS MESSAGE (8 Oct, news.render): a bold heading with
  # the day, then at most 5 stories, each "- **Headline** ([Outlet](<url>))"
  # with a blank line between them. A PoC story keeps its own line.
  #
  # THE FOLLOW-UP CARRIES ONLY WHAT IS MAJOR: a story at or above
  # NEWS_OVERFLOW_MIN_IMPORTANCE (5) that did not fit goes out right after as
  # ONE message, "More AI News", PoC first, at most NEWS_OVERFLOW_MAX_ITEMS (5)
  # — outside the daily cap and not a breaking message. What scored lower and
  # did not fit stays unsent, and is given to whoever asks for the news. An
  # answer in the channel gives the 5 best stories not sent before, newest
  # first, and repeats one only when nothing new is left. Hourly silent checks (NEWS_CHECK_TIMES) still post only what is
  # major (importance 5), and a story a weekend check held because the valve
  # was full is in Monday's post. The .env settings take precedence over this
  # row.
  #
  # NEVER HELD. It is new content every day, so the re-ask clock does not apply
  # (drip.NEVER_HELD). It has NO FIXED TIME since 8 Oct: it takes its place in
  # daily_order like any other rule and counts as one of the day's 5 posts. No
  # AI news post on a Saturday or Sunday; the hourly checks run every day.
  - id: R1
    name: AI news
    plain: today's AI news worth reading — the industry, and our own PoCs
    # The Bot Rules tab, rule 1, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Today's AI news worth reading — the industry, and our own PoCs.
      One post every weekday, in its place in the day's order (6 PM on
      Monday and Friday, 8 PM on Tuesday, 4 PM on Wednesday and Thursday;
      earlier when a rule ahead of it has nothing to post), with up to 5
      stories since the last AI news post (Monday's covers the weekend). First the top 2 stories about
      people on Outreach PoCs or companies on Master Pipeline / Outreach
      PoCs, each marked with its sheet row, e.g. "(Synthflow AI — on
      Master Pipeline)"; then the best of everything else. Every news
      message looks the same: a bold heading with the day, then at most 5
      stories, each a bold headline with a link to the outlet. Major
      stories that didn't fit follow straight away in one "More AI News"
      message (major stories only, at most 5), which doesn't count toward
      the 5 posts a day. Asked for the news in the channel, Saley gives the
      5 best stories it hasn't sent before, newest first, and repeats a
      story only when nothing new is left. Never held back as "asked
      recently". Checked again
      every hour, weekends included, and posted straight away only when
      something is major. No AI news post on Saturday or Sunday. Nobody on
      the departures list is looked up.
    weekdays: [mon, tue, wed, thu, fri]
    trigger: ai_news
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R2
  # For companies in the news that are NOT in the Master Pipeline, say why each
  # is or isn't relevant to membrane. Permission is asked before anything is
  # added to the sheet — the bot never adds a row on its own.
  - id: R2
    name: News-company screen
    plain: companies in the news that aren't in the pipeline yet
    weekdays: [tue, fri]
    trigger: news_company_screen
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R3
  # EVERY WEDNESDAY (S3; EVENTS_ANCHOR_DATE and the every-other-week cadence are
  # retired), and the ONE events path — the separate "one reminder at T-20"
  # lane is retired too. Per row (Event, Date, Last day for registration,
  # Registered, Link), with a window of EVENTS_WINDOW_DAYS (14), so an event
  # next Tuesday is in THIS Wednesday's post:
  #   date passed                      never mentioned
  #   registered                       "You're registered for X on <date>"
  #   not registered, deadline ahead   "Register for X by <deadline> (event on <date>)"
  #   not registered, deadline passed  skipped, logged "registration closed"
  #   not registered, no deadline      "X on <date> — no registration deadline on the sheet"
  #   date unreadable                  listed ONCE, "date unclear"
  # It closes with "Want me to remind you again on Monday?" — "tomorrow" when an
  # event falls before Monday. A yes schedules one reminder for
  # EVENTS_REMIND_AGAIN_WEEKDAY at 14:00 in the channel, listing those events;
  # it is a reminder, so it does not count toward the cap. Discovery (events the
  # tab lacks) and the deadline backfill still run, and still ask first.
  - id: R3
    name: AI events and summits
    plain: AI events and summits coming up
    # The Bot Rules tab, rule 3, column "What the Bot Shares / Checks".
    sheet_wording: >-
      AI events and summits coming up. Every Wednesday, checks the AI
      Events & Summits tab and lists what falls in the next 14 days:
      "You're registered for X on <date>" when Registered is Yes;
      "Register for X by <deadline> (event on <date>)" when it isn't and
      the last day for registration is still ahead; "X on <date> — no
      registration deadline on the sheet" when that cell is blank. An
      event that has passed, or whose registration has closed, is not
      mentioned; one whose date can't be read is listed once as "date
      unclear". Ends with "Want me to remind you again on Monday?" (or
      "tomorrow" if an event is before Monday): a yes posts the list
      once more that day at 2 PM, and that doesn't count toward the 5
      posts a day. Still looks for events the tab lacks and for missing
      deadlines, and asks before adding anything.
    weekdays: [wed]
    trigger: events
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R4
  # P1 deliverables due this week — title, team, due date and link.
  #
  # P1 ONLY (Priority matches DELIVERABLE_P1_MARKERS), status not in
  # DELIVERABLE_DONE_MARKERS (blank counts as open), deadline on or before the
  # end of this week (the Sunday) or already past. A P2 or P3 row is never
  # mentioned, whatever its deadline; each one skipped is logged with its
  # priority. Each item is:
  #     1. <Action Item>
  #        Team: <Functional Dependency, or DELIVERABLE_DEFAULT_OWNER if blank>
  #        Due: Thu 2 Oct  (· 3 days overdue)
  #        [Doc](<link>)          <- only if the row has one
  # NO REPEATS: the same Action Item appears once, and each link appears once
  # in the whole message. No remarks. No open P1 means no message. The same on
  # a real day, a test day and a simulation: one selection
  # (nextaction._r_deliverables), one renderer (drip.render_deliverables), one
  # sender.
  - id: R4
    name: Deliverables checklist
    plain: P1 deliverables due this week — title, team, due date and link
    description: P1 deliverables due this week — title, team, due date and link
    # The Bot Rules tab, rule 4, column "What the Bot Shares / Checks".
    sheet_wording: >-
      P1 deliverables due this week — title, team, due date and link.
      Checks the Deliverables Checklist for rows with Priority P1 whose
      Status is not done and whose Tentative Deadline is on or before
      the end of this week, or has already passed. Shares one Monday
      post: a numbered list where each item is its Action Item, then
      "Team: <Functional Dependency>" (the default owner when that is
      blank), then "Due: <day date>" (with "· N days overdue" when it is
      late), then the row's link as [Doc] if it has one. The same Action
      Item appears once, and each link appears once in the message. No
      remarks. P2 and P3 items are never mentioned. If no P1 is open,
      nothing is posted.
    weekdays: [mon]
    trigger: deliverables
    # The week's P1 checklist in ONE Monday post, grouped by rule (not by
    # team), in numbered points; a list past 2000 characters is split between
    # lines into consecutive messages that count as one slot.
    max_items_per_post: 20
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R13
  # NEXT STEPS FOR CONNECTED CONTACTS (added by Vaishnavi, 7 Oct 2026).
  #
  # LISTED HERE, BEFORE R5, ON PURPOSE. One contact is named once a day and the
  # earlier rule keeps them; R13 names 5 people and R6 selects every connected
  # contact, so R13 goes first. Listed after R6 it would lose almost everyone
  # it picked every Tuesday and Friday. The consequence: on a day R13 names
  # somebody, R5, R6 and R10 skip that person. Ids are not renumbered.
  #
  # WHO: Outreach PoCs rows where "Sid - LI Addition" is Connected
  # (NEXT_STEP_CONNECTED_MARKERS) and LI Connected Date holds a date. A
  # connected row with no readable date is skipped, logged, and listed in
  # `cadence preview`. Prospect Status "Unresponsive" (or any stop marker)
  # takes a row out, as it does for every rule.
  #
  # WHAT EACH PERSON IS ASKED, from Next Steps (Q) and that step's cells:
  #   Next Steps          also                     due                               asks
  #   blank                                        LI Connected + NEXT_STEP_FIRST_DAYS (2)
  #                                                                                  what's the next step
  #   Research the PoC                             the same                          researched? then "Send email 1"
  #   Send email N        Nth Email Sent not yes   previous date +
  #                                                NEXT_STEP_AFTER_PREVIOUS_DAYS (2) has it gone out
  #   Send email N        sent, date logged        Nth Email Date +
  #                                                NEXT_STEP_AFTER_EMAIL_DAYS (7)    set the next step
  #   Send email N        sent, no date            now                               log the date
  #   Reach by LI DM      no LI DM Date            3rd Email Date +
  #                                                NEXT_STEP_AFTER_PREVIOUS_DAYS     has the DM gone out
  #   Reach by LI DM /    LI DM Date, no meeting   LI DM Date +
  #   Call the PoC                                 NEXT_STEP_CALL_AFTER_DM_DAYS (7),
  #                                                then every
  #                                                NEXT_STEP_CALL_EVERY_DAYS (3) until
  #                                                + NEXT_STEP_CALL_UNTIL_DAYS (21)  time to call
  #   after that                                   once                              set Prospect Status to
  #                                                                                  Unresponsive; never again
  # "Previous date" is LI Connected Date for email 1 and the (N-1)th Email Date
  # for emails 2 and 3; blank means due now, and the line asks for it too.
  #
  # THE ROTATION: up to max_items_per_post people a post. Call reminders that
  # are due go first; then whoever R13 named least recently, never-named people
  # first, ties in sheet order. So it walks the Connected list top to bottom and
  # starts again from the top. A person whose step changed is treated as new.
  #
  # AWAITING VAISHNAVI (built as defaults; each is changed here or in .env):
  #   a. weekdays only, 15:00 IST           -> `weekdays` below; NEXT_STEP_TIME
  #   b. outside the daily cap              -> `counts_toward_cap` below
  #   c. remind only; never writes Q to W   -> RESTRICTED_COLUMN_RANGES (no switch)
  #   d. a "done" from any teammate counts  -> replies arrive with NFT2-1063
  #   e. sheet order; Priority is read, not used for the order
  #   f. LI DM Sent "Replied": no call chase, asks about the meeting
  #                                         -> NEXT_STEP_DM_REPLIED_MARKERS
  #   g. a meeting booked for today or later pauses the rule for that person;
  #      a Completed meeting ends it (R9 takes over)
  #                                         -> NEXT_STEP_PAUSE_FOR_BOOKED_MEETING
  #
  # The post time is NEXT_STEP_TIME until NFT2-1069 adds `fixed_time`. Never
  # held by the re-ask clock (drip.NEVER_HELD): the rule has its own.
  - id: R13
    name: Next steps for connected contacts
    plain: next steps for the people we're connected with
    # The Bot Rules tab, rule 13, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Next steps for the people we're connected with. Monday to Friday at
      3 PM: Outreach PoCs rows where Sid - LI Addition is Connected and LI
      Connected Date is filled. One post naming up to 5 people, taken from
      the top of the sheet down and then from the top again; someone whose
      call reminder is due goes first. One line each, saying what to do
      next according to Next Steps: if it is blank, asks what the next
      step is (2 days after connecting); "Research the PoC", asks whether
      they have been researched and to set Next Steps to "Send email 1";
      "Send email 1/2/3", asks whether that email has gone out and to mark
      its Sent cell and date (2 days after the previous step), and a week
      after the email's date asks to move Next Steps on (after email 3, to
      "Reach by LI DM"); "Reach by LI DM", asks whether the DM has gone
      out. A week after the LI DM Date with no meeting, reminds to call
      them, again every 3 days until 3 weeks after the DM; then asks once
      to set Prospect Status to "Unresponsive" and stops for that person.
      If LI DM Sent says Replied, asks whether a meeting is being set up
      instead. A booked meeting pauses it; a Completed meeting ends it.
      Saley only reminds; it never fills these cells. Doesn't count toward
      the 5 posts a day.
    weekdays: [mon, tue, wed, thu, fri]
    trigger: next_step_followups
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: false
    enabled: true

  # ---------------------------------------------------------------- R5
  # Outreach PoCs rows where First Contact is FALSE or blank. Five contacts a
  # post, in the role order founders > CXO > chief scientist > research. Two
  # companies or universities a week, in sheet order — stay with a company
  # until all its contacts have a first contact recorded. If the same contact
  # comes up three times with no update, ask whether to skip it.
  #
  # S3: EVERY such row the stop rules allow — not only the "active" ones, which
  # is what a never-contacted row is not. The two-a-week and the "skip them?"
  # counters are now actually written, after each post that lands.
  #
  # THE EMAIL. For each contact in the post whose Email cell is blank: ONE
  # search ('"<name>" "<company>" email'), a light-model extraction, and the
  # address is kept ONLY if it appears word for word in a snippet the search
  # returned. The line says "email found: x@y.com (<source>)" or "no public
  # email found". Never a guessed pattern. At most EMAIL_LOOKUP_MAX_PER_POST;
  # cached RESEARCH_CACHE_DAYS. With EMAIL_WRITE_ALLOWED=true the post offers
  # to add what it found: a yes re-reads the row and writes ONLY the Email
  # cell, ONLY if it is still blank — logged in sheet_writes, undoable. That
  # is the single exception to "columns A:I are never written". R6 uses the
  # same lookup and the same offer.
  - id: R5
    name: Prospects to contact
    plain: people we haven't made first contact with
    # The Bot Rules tab, rule 5, column "What the Bot Shares / Checks".
    sheet_wording: >-
      People we haven't made first contact with. Tuesday and Thursday:
      every Outreach PoCs row where First Contact is FALSE or blank,
      unless the row is dead, won or lost — two companies a week in
      sheet order, staying with a company until all its contacts are
      done; up to 5 contacts a post, founders first. For a contact with
      no email on the sheet, searches once for a published address and
      shows "email found: x@y.com (source)" or "no public email found" —
      never a guessed address. If one was found, asks whether to add it
      to the sheet; on a yes writes only that Email cell, and only if it
      is still blank (it can be undone). After the same contact has been
      listed 3 times with nothing changed, asks whether to skip them.
    weekdays: [tue, thu]
    trigger: prospects
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R6
  # LinkedIn connected, no DM after 3 days. Says whether an email is on file;
  # if not, the research layer will look for a verified public one and say
  # where it was found, or that none was.
  #
  # 7 OCT 2026: THIS IS THE EMAIL CHECK (Vaishnavi: "Bot to find whether a
  # verified email ID exists for the contact"). Its trigger, days and lookup
  # are unchanged; its item line no longer says "no DM logged", because in the
  # sequence the sheet now follows the DM comes after three emails and R13 owns
  # the step reminders. The name, `plain` and the post's heading still say "no
  # DM" and wait for wording from Vaishnavi.
  - id: R6
    name: LinkedIn connected, no DM
    plain: people connected on LinkedIn with no DM yet
    weekdays: [tue, fri]
    trigger: li_no_dm
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R7
  # DM sent, no meeting after 7 days. Shows days since the DM and the last note
  # logged against that contact.
  #
  # S3: at most DM_NO_MEETING_MAX_CONTACTS (5) CONTACTS, not companies. Longest
  # since the DM first; ties by PROSPECT_ROLE_ORDER (founder first), then sheet
  # order. One line each: name — company — DM sent N days ago — last note.
  # Overflow: "+N more next Monday".
  #
  # RULE 13 COMES FIRST (Vaishnavi, 7 Oct: "rule 13 supercedes this"). Back on
  # Mondays since 8 Oct, but NEVER for a person Rule 13 covers: "Sid - LI
  # Addition" Connected with an LI Connected Date (nextaction.
  # covered_by_next_steps, Rule 13's own check). Those people get Rule 13's
  # call reminders instead. On 7 Oct every row with an LI DM Date was
  # Connected, so this rule lists somebody only when a DM went to a person who
  # is not marked Connected, or whose LI Connected Date is missing.
  - id: R7
    name: DM sent, no meeting
    plain: people we DM'd who haven't booked a meeting
    # The Bot Rules tab, rule 7, column "What the Bot Shares / Checks".
    sheet_wording: >-
      People we DM'd more than 7 days ago who haven't booked a meeting,
      every Monday, second in the day's order: days since the DM and the
      last note logged. Rule 13 comes first: anyone it covers (Sid - LI
      Addition says Connected and the LI Connected Date is filled in) gets
      Rule 13's reminders and is never listed here. At most 5 people a
      post.
    weekdays: [mon]
    trigger: dm_no_meeting
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R8
  # ANCHORED TO THE MEETING, NOT TO A WEEKDAY — hence the empty weekday list.
  # Touches at 5 days before, 3 days before, and MEETING_DAYOF_TIME (10:00) on
  # the day. Touches already in the past are skipped, so a meeting booked with
  # three days' notice gets the 3-day and day-of touches and not a late
  # 5-day one. A reschedule re-anchors every touch on the new date.
  #
  # counts_toward_cap: false — a meeting is time-critical and must not be
  # crowded out by a Monday chase. Never held by the re-ask clock either: each
  # touch belongs to one date, and a held touch is a lost one.
  # A FIXED TIME (8 Oct): every touch posts at MEETING_DAYOF_TIME (10:00), not
  # only the meeting-day one. Outside daily_order and the 2-hour gap.
  - id: R8
    name: Meeting preparation
    plain: meetings coming up that need prep
    # The Bot Rules tab, rule 8, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Meetings coming up that need prep. Three touches for each meeting on
      Outreach PoCs: 5 days before, 3 days before and on the day. Every
      touch posts at 10 AM, outside the day's order, and doesn't count
      toward the 5 posts a day. Asks whether the deck, package and demo are
      ready, with any recent news on the company.
    weekdays: []
    trigger: meeting_prep
    max_items_per_post: 3
    destination: channel
    counts_toward_cap: false
    enabled: true

  # ---------------------------------------------------------------- R9
  # ANCHORED TO THE MEETING. 3 days after a completed meeting with no next
  # steps, then every 3 days: one channel post, then two DMs, then one
  # escalation to Sid, then stop. Asks for next steps, the package discussed
  # and an estimated deal size.
  #
  # destination is "channel" because that is where the FIRST touch goes; the
  # engine escalates the later ones itself and records which stage each item is
  # at. See the DM note at the bottom of this file.
  #
  # THE LADDER CLIMBS ONE RUNG EACH TIME A FOLLOW-UP ACTUALLY GOES OUT (the
  # sender advances it, after the send) and STOPS after the last rung. It is
  # cleared when Notes/Remarks is filled or the meeting date changes, so the next
  # stalled meeting with the same contact starts at rung 1. Outside the daily
  # cap, and on its own clock: the re-ask clock does not apply.
  #
  # "NEXT STEPS" HERE MEANS THE NOTES COLUMN, Z "Notes/Remarks" (Vaishnavi, 7
  # Oct: "it means the next steps from notes; i've changed tht column name to
  # avoid confusion"). It never reads Q, the Next Steps dropdown.
  - id: R9
    name: Meeting done, no next steps
    plain: meetings that happened with no next steps recorded
    # The Bot Rules tab, rule 9, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Meetings that happened with no next steps recorded. Checks Outreach PoCs
      for a completed meeting whose Notes/Remarks is blank. Asks 3 days after
      the meeting, then every 3 days, one step at a time: a channel post, then
      two DMs, then one escalation to Sid — and then stops. Asks for the next
      steps, the package discussed and an estimated deal size. Filling in
      Notes/Remarks ends it. Posts at 10 AM, outside the day's order, and
      doesn't count toward the 5 posts a day.
    weekdays: []
    trigger: meeting_followup
    max_items_per_post: 3
    destination: channel
    counts_toward_cap: false
    enabled: true

  # ---------------------------------------------------------------- R10
  # Prospect status deal / demo / quote AND closure probability strictly above
  # CLOSURE_SUPPORT_MIN (50). Exactly 50 is EXCLUDED — "above 50" is the rule
  # as written, and a boundary a bot decides for itself is a boundary nobody
  # agreed to. Asks what is needed for the next stage and shares relevant news.
  #
  # S3: when Prospect Status (or Closure Prob%) is blank on EVERY active row
  # the rule cannot run, and says so in one line rather than staying silent
  # (nextaction.CLOSURE_EMPTY_NOTICE). When the columns have values and no deal
  # qualifies, it stays silent and the log says why.
  - id: R10
    name: Closure support
    plain: deals close enough to push over the line
    # The Bot Rules tab, rule 10, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Deals close enough to push over the line. Mondays: rows whose
      Prospect Status is deal / demo / quote and whose Closure Prob% is
      above 50 (exactly 50 doesn't count); offers help and shares
      relevant news. If Prospect Status or Closure Prob% is blank on
      every active row, posts "No closure support this week — Prospect
      Status and Closure Prob% are empty in the GTM sheet. Fill them in
      and I'll pick it up next Monday." If the columns have values but
      no deal qualifies, stays silent.
    weekdays: [mon]
    trigger: closure_support
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R11
  # WEDNESDAYS ONLY since 8 Oct, first in the day's order. A company is noticed
  # the day it appears (the snapshot is taken on every run of the queue, every
  # sending day) and is asked about on the NEXT Wednesday that is at least
  # NEW_COMPANY_AFTER_WORKING_DAYS (1) working day after it appeared and no
  # more than NEW_COMPANY_WINDOW_DAYS (7) days after: exactly one Wednesday for
  # every company. max_items_per_post is 10, not 3: with a weekly post, a
  # company left out of this Wednesday's would be past the window by the next.
  #
  # One WORKING day after a company first appears in the Master Pipeline.
  # THERE IS NO CREATED-DATE COLUMN on that tab, so "appears" is detected by
  # comparing today's company names against a daily snapshot in SQLite. The
  # snapshot is taken by the caller, not by the engine, so the engine stays
  # pure — see nextaction.run's docstring.
  #
  # ASKS FIRST. Names the companies and asks whether to look for PoCs. No
  # web search until an approver says yes; then named people from the
  # company's own site and public profile links, each with its source.
  # Permission is asked again before anyone is added to Outreach PoCs.
  - id: R11
    name: New company in Master Pipeline
    plain: new companies in the pipeline — asks before looking up PoCs
    # The Bot Rules tab, rule 11, column "What the Bot Shares / Checks".
    sheet_wording: >-
      New companies in the Master Pipeline, every Wednesday, first in the
      day's order (2 PM): every company that appeared on the tab since last
      Wednesday's post, whatever day it appeared. Names them and asks
      whether to look for relevant PoCs; nothing is searched until an
      approver says yes, and nobody is added to Outreach PoCs without a
      separate yes. Up to 10 companies a post.
    weekdays: [wed]
    trigger: new_pipeline_company
    max_items_per_post: 10
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R12
  # Every package on the Sales Packages tab where Ready? is No or blank. Asks
  # for the status and the expected ready date. Blank reads as No — see
  # gtm_sheet.ready_flag for why that direction and not the other.
  - id: R12
    name: Sales packages
    plain: sales packages that aren't ready yet
    weekdays: [thu]
    trigger: sales_packages
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

# =============================================================================
# THE DM NOTE
#
# R9 escalates to DMs after its first touch, and the strategy doc's escalation
# rule does the same for anything three or more days overdue. With
# SALES_DMS_ENABLED off, an item whose rung resolves to "dm" or "escalation" is
# still computed, still ranked and still shown in `cadence preview` — and it
# POSTS IN THE CHANNEL as an ordinary follow-up. The escalation rung posts in
# the channel ADDRESSED TO ESCALATION_ADDRESSEE (Sid).
#
# THE MESSAGE DOES NOT MENTION ANY OF THIS. It used to say "this would have
# been a DM", and that was the wrong thing to tell anybody: the reader does not
# care about the bot's delivery plumbing, and a nudge that spends a clause
# apologising for its own channel reads as a bot with a problem rather than a
# colleague with a question. The fallback is LOGGED instead —
# `[dm] fallback-to-channel rung=N item=...` — where an operator sees it and
# the team does not.
# =============================================================================
