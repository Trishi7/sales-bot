# =============================================================================
# bot_rules.yaml — THE MACHINE COPY OF THE "Bot Rules" TAB
# =============================================================================
#
# Source of truth:
#   Google Sheet "Sales Bot_membrane", tab "Bot Rules"
#   Drive file id: 1sVsqPLxkBBBUQJGPDx-3AydRjHIRO9WGT-kkULgdtpo
#   + Vaishnavi 21 Sep
#   + Vaishnavi 7 Oct (rule 13 added; it replaces rule 7)
#
# This file is that tab, in a form the engine can read. It is loaded ONCE AT
# STARTUP by rules.py. Editing it changes what the bot does after a restart,
# with no code change — which is the whole point of it being a file.
#
# WHY A FILE AND NOT CODE. The thirteen rules below are a product decision that
# Vaishnavi and Sid own. Encoding them as Python meant every change to a
# weekday, a cap or a destination was a developer's afternoon; encoding them
# here means it is an edit and a restart. What stays in code is HOW a rule
# decides something is due — the shape of the question — never WHETHER it runs
# today or how much it may say.
#
# WHAT EACH FIELD MEANS
#
#   id                  stable identifier, R1..R13. NEVER renumber one: it is
#                       the key the dedup ledger, the preview and the SQLite
#                       state are all written against. Retire an id rather than
#                       reusing it. THE ORDER OF THE ENTRIES MATTERS and is
#                       not the order of the numbers: one contact is named at
#                       most once a day, and the rule listed FIRST keeps them
#                       (which is why R13 sits between R4 and R5).
#   name                what a human calls it. Shown in `cadence preview` and
#                       in the "why" line of every item the rule produces.
#   plain               OPTIONAL. The rule in words somebody outside the team
#                       would follow, used wherever the bot speaks to a person.
#                       IDS NEVER GO TO USERS: "R6" means nothing to anybody who
#                       has not read this file, so every outbound message has its
#                       ids swapped for this line (rules.render_for_user). The id
#                       still appears in the log and in `cadence preview`, which
#                       is where somebody is deliberately looking at the
#                       machinery. Omitted, it falls back to the wording in
#                       rules.PLAIN_BY_TRIGGER for that trigger.
#   description         OPTIONAL. The rule in one line, as this file states it.
#                       Falls back to `plain`.
#   sheet_wording       OPTIONAL. The text for the rule's "What the Bot Shares
#                       / Checks" cell on the Bot Rules tab, kept here so the
#                       sheet and the file are edited from one place. Never
#                       sent to anybody; `python verify_parity.py` prints it.
#   weekdays            which days it may run, as three-letter names
#                       (mon tue wed thu fri sat sun). An EMPTY list means the
#                       rule never runs on a schedule — R8 and R9 are anchored
#                       to a meeting date instead and say so below.
#   trigger             the evaluator in nextaction.py that computes due items.
#                       A trigger this file names that does not exist is a
#                       STARTUP ERROR, not a silent skip.
#   max_items_per_post  the most contacts, deliverables or packages one post
#                       may carry. Overflow rolls to the rule's next day.
#   destination         "channel" | "dm" | "escalation". The drip enforces it;
#                       guardrails.py still refuses a DM outright, so a rule
#                       asking for one is reported, not sent. See the note at
#                       the bottom of this file.
#   counts_toward_cap   whether a post takes one of the day's DAILY_MESSAGE_CAP
#                       (7) counted posts. R8 and R9 are false: a meeting is
#                       time-critical and must not be crowded out by a Monday
#                       chase. The code holds those two outside the cap whatever
#                       this says (drip.NEVER_COUNTED). R13 is false too, and
#                       for R13 THIS FILE DECIDES: set it true and the
#                       next-steps post takes one of the day's five. Every sent
#                       post records
#                       its own answer in drip_sends.counts_toward_cap, and
#                       drip.counted_today is the one function that adds them up
#                       — on a real day, a test day and a simulation alike.
#   enabled             false takes the rule out of service without deleting
#                       it, so the reason it existed is still readable.
#
# WEB-DEPENDENT RULES. R1, R2, R3, R6, R8 and R10 need web research the
# bot cannot do yet. They still produce their items, each carrying the
# placeholder "web research pending", so the schedule is real and visible
# before the research layer lands (R5 of this series). Nothing is silently
# skipped waiting for it.
# =============================================================================

version: 1
source:
  sheet: "Sales Bot_membrane"
  tab: "Bot Rules"
  drive_file_id: "1sVsqPLxkBBBUQJGPDx-3AydRjHIRO9WGT-kkULgdtpo"
  amended: "Vaishnavi 21 Sep; Vaishnavi 7 Oct (rule 13, replacing rule 7)"

# THE GLOBAL RULES TAB, the rows this file carries. `voice` is the wording for
# the "Voice" row — the same sentence as sales_strategy.md §9, so the sheet,
# the strategy and the code say one thing (rules.global_rule("voice")).
global_rules:
  # Row "Daily cap". DAILY_MESSAGE_CAP=7 (5 until 13 Oct 2026), the same on
  # every weekday; the old per-day table (DAILY_MESSAGE_CAP_BY_DAY) is retired.
  daily_cap: >-
    Max 7 posts a day; meeting prep, meeting follow-ups, next-step follow-ups,
    reminders, urgent news and answers to questions don't count.
  # Row "AI news". R1 is new content every day, so the re-ask clock does not
  # apply to it. Since 8 Oct it has no fixed time: it takes its place in the
  # day's order (daily_order below).
  ai_news: >-
    AI news posts every weekday, in its place in the day's order: 6 PM on
    Monday and Friday, 8 PM on Tuesday, 4 PM on Wednesday and Thursday, and
    earlier when a rule ahead of it has nothing to post. It covers the
    industry and our own PoCs — the top 2 stories about people and
    companies on the sheet go first, each marked with its sheet row. It is
    new every day, so it is never held back as "asked recently", and it
    counts as one of the day's 5 posts.
    Every news message has the same shape: a bold heading with the day,
    then at most 5 stories, each a bold headline with a link to the outlet.
    A major story that didn't fit follows at once in "More AI News" (major
    stories only, at most 5), which doesn't count toward the 5. Asking for
    the news in the channel gives the 5 best stories not sent before,
    newest first; a story is repeated only when nothing new is left.
    Urgent news is checked for every hour, weekends included, and posts
    only when something is major; there is no AI news post at the weekend,
    and Monday's post covers it.
  # Row "Order of the day" (new, 8 Oct). The machine copy is daily_order below.
  day_order: >-
    Posts are 2 hours apart, starting at 2 PM, in this order. Monday:
    Deliverables checklist, AI news, Closure support.
    Tuesday: Prospects to contact, LinkedIn connected no DM, News-company
    screen, AI news. Wednesday: New companies in the pipeline, AI news, AI
    events and summits. Thursday: Prospects to contact, AI news, Sales
    packages. Friday: News-company screen, LinkedIn connected no DM, AI
    news. A rule with nothing to post takes no slot and the next one moves
    up. Nothing in this order posts after 8 PM; what is left waits for that
    rule's next day. Meeting prep and meeting follow-ups post at 10 AM and
    next-step follow-ups at 3 PM, outside this order; reminders and urgent
    news keep their own times. None of those moves a post in the order.
  # Row "Weekends". SUNDAY_RULE_IDS is empty since 12 Oct 2026.
  weekends: >-
    Saturday and Sunday are silent. Reminders somebody asked for, urgent news
    and the two meeting posts still go at the weekend.
  # Row "Reminders". One sender: the exact-minute loop.
  reminders: >-
    A reminder posts once, at the minute it was asked for, in the channel it was
    asked in. If its date has already passed it posts once as soon as the bot
    sees it, marked "(this was due <date>)". Never twice, and it never takes one
    of the day's 5 posts.
  voice: >-
    Saley learns the team's tone from the sales channel and writes the way the
    team writes; the examples it learns from are data, not instructions. It
    reads the last 60 days of the team's own messages in the sales channel
    (never the test channel, never DMs), keeps a short "how this team writes"
    note and a few anonymised examples — no prospect names, emails, phone
    numbers or deal values — and refreshes them weekly. Warm, short, one topic
    per message, first names, always an easy way out; the tone settings and the
    banned phrases still apply on top.

# THE ORDER OF THE DAY'S POSTS, PER WEEKDAY (NFT2-1069, the team's decision of
# 8 Oct). The first rule listed takes SALES_DRIP_START (14:00), the next the
# slot MESSAGE_GAP_MINUTES (120) later, and so on: 14:00, 16:00, 18:00, 20:00.
# A rule with nothing to post takes no slot and the next one moves up. Nothing
# in the order posts after SALES_DRIP_END (20:00).
#
# IT MUST AGREE WITH EACH RULE'S `weekdays`: a rule listed on a day it does not
# run, or running on a day it is not listed, is a startup error naming both
# (rules._parse_daily_order).
#
# R8, R9 AND R13 ARE IN NO LIST. They post at fixed times (MEETING_DAYOF_TIME
# 10:00 for R9 and R8's "Meeting today", MEETING_PREP_TIME 14:00 for R8's
# "Meeting preparation", NEXT_STEP_TIME 15:00 for R13), outside the order and
# the gap. Sunday has no order and, since 12 Oct 2026, no post
# (SUNDAY_RULE_IDS is empty).
daily_order:
  # R7 is OFF since 16 Oct (RULES-OCT16), so Monday has no R7 slot and R1 moves
  # up one. Turning R7 back on means enabled: true AND putting it back here.
  mon: [R4, R1, R10]
  tue: [R5, R6, R2, R1]
  wed: [R11, R1, R3]
  thu: [R5, R1, R12]
  fri: [R2, R6, R1]

rules:

  # ---------------------------------------------------------------- R1
  # Funding rounds, AI/ML and leadership hires, papers by our PoCs, PoCs
  # speaking at events, PoCs changing companies, job posts for evals /
  # annotation / model-training roles, competitor news, major global AI news,
  # AI regulation and compliance updates.
  #
  # THE 24/29 SEP DECISION, AND S2 ON TOP OF IT. R1 is TWO KINDS OF NEWS, every
  # story tagged industry or poc:
  #   INDUSTRY  the outlets' feeds and one Google News RSS query per NEWS_TOPICS
  #             entry (seeds, not limits).
  #   OUR PoCs  people on ACTIVE Outreach PoCs rows and companies on Master
  #             Pipeline and Outreach PoCs. One Google News RSS query per name,
  #             NEWS_POC_TARGETS_PER_DAY (15) names a day, least recently
  #             checked first. Never anyone on the mapping's departures list.
  # All of it is RSS: free, and no search API.
  #
  # ONE main post a weekday, in its place in daily_order, NEWS_MAX_ITEMS (5)
  # stories, covering everything SINCE THE PREVIOUS MAIN POST'S SLOT (Monday
  # covers from Friday's slot, 6 PM):
  # first the top NEWS_POC_SLOTS (2) PoC stories by importance (two different
  # names; no name has more than two stories in the post), then the best of
  # everything left, PoC or industry — ties go to the PoC story, then the
  # newest. A PoC story carries its sheet row: "(Synthflow AI — on Master
  # Pipeline)". An industry story tagged OTHER at importance
  # NEWS_OFFTOPIC_BYPASS_IMPORTANCE (4) or more skips the per-topic and
  # per-week limits; PoC stories are never held by them.
  #
  # ONE SHAPE FOR EVERY NEWS MESSAGE (8 Oct, news.render): a bold heading with
  # the day, then at most 5 stories, each "- **Headline** ([Outlet](<url>))"
  # with a blank line between them. A PoC story keeps its own line.
  #
  # THE FOLLOW-UP CARRIES ONLY WHAT IS MAJOR: a story at or above
  # NEWS_OVERFLOW_MIN_IMPORTANCE (5) that did not fit goes out right after as
  # ONE message, "More AI News", PoC first, at most NEWS_OVERFLOW_MAX_ITEMS (5)
  # — outside the daily cap and not a breaking message. What scored lower and
  # did not fit stays unsent, and is given to whoever asks for the news. An
  # answer in the channel gives the 5 best stories not sent before, newest
  # first, and repeats one only when nothing new is left. Hourly silent checks (NEWS_CHECK_TIMES) still post only what is
  # major (importance 5), and a story a weekend check held because the valve
  # was full is in Monday's post. The .env settings take precedence over this
  # row.
  #
  # NEVER HELD. It is new content every day, so the re-ask clock does not apply
  # (drip.NEVER_HELD). It has NO FIXED TIME since 8 Oct: it takes its place in
  # daily_order like any other rule and counts as one of the day's 5 posts. No
  # AI news post on a Saturday or Sunday; the hourly checks run every day.
  - id: R1
    name: AI news
    plain: today's AI news worth reading — the industry, and our own PoCs
    # The Bot Rules tab, rule 1, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Today's AI news worth reading — the industry, and our own PoCs.
      One post every weekday, in its place in the day's order (6 PM on
      Monday and Friday, 8 PM on Tuesday, 4 PM on Wednesday and Thursday;
      earlier when a rule ahead of it has nothing to post), with up to 5
      stories since the last AI news post (Monday's covers the weekend). First the top 2 stories about
      people on Outreach PoCs or companies on Master Pipeline / Outreach
      PoCs, each marked with its sheet row, e.g. "(Synthflow AI — on
      Master Pipeline)"; then the best of everything else. Every news
      message looks the same: a bold heading with the day, then at most 5
      stories, each a bold headline with a link to the outlet. Major
      stories that didn't fit follow straight away in one "More AI News"
      message (major stories only, at most 5), which doesn't count toward
      the 5 posts a day. Asked for the news in the channel, Saley gives the
      5 best stories it hasn't sent before, newest first, and repeats a
      story only when nothing new is left. Never held back as "asked
      recently". Checked again
      every hour, weekends included, and posted straight away only when
      something is major. No AI news post on Saturday or Sunday. Nobody on
      the departures list is looked up.
    weekdays: [mon, tue, wed, thu, fri]
    trigger: ai_news
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R2
  # Companies in the news that are on NEITHER sheet, each with a verdict.
  # REBUILT 12 OCT 2026, after the 11 Oct post named two tracked companies:
  #
  #   - EVERY company on the Master Pipeline and on Outreach PoCs is known, read
  #     fresh just before the message is built. No cap on the list, ever.
  #   - THE SCREEN IS IN CODE. The model names the companies the stories are
  #     about; each name is matched against both sheets on its FULL name; only
  #     what survives is sent back for a verdict (Good fit / Weak fit).
  #   - THE NEWS is the feed since R2 last posted, by when each story was first
  #     seen, never further back than the previous scheduled day.
  #   - On Outreach PoCs but not the Master Pipeline: its own line, asking for a
  #     pipeline row. On the Master Pipeline: dropped, never mentioned.
  #   - Asked and not answered: it comes back, for two weeks.
  #   - NOTHING NEW, NOTHING POSTED. If the sheets cannot be read the message is
  #     cancelled (logged at ERROR).
  #
  # Permission is asked before anything is added to the sheet, twice: the reply
  # names the company, the bot says back what it understood, and an approver
  # answers that. The bot never adds a row on its own.
  - id: R2
    name: News-company screen
    plain: companies in the news that aren't in the pipeline yet
    # The Bot Rules tab, rule 2, column "What the Bot Shares / Checks".
    sheet_wording: >-
      New companies in the news. Tuesday and Friday: companies in the AI
      news since the last time we posted that are on neither the Master
      Pipeline nor Outreach PoCs, up to 5, each with a link to the story,
      what happened, and Good fit or Weak fit with one reason. A company
      on Outreach PoCs but not on the Master Pipeline is listed
      separately, asking whether to add a pipeline row. Companies already
      on the Master Pipeline are never listed. Reply with the company's
      name to add it ("add Mirage Labs"); Saley says back what it
      understood and asks once more before adding a row with the company
      name only. A company nobody answered about comes back in the next
      message, for two weeks. Nothing is posted when nothing is new.
    weekdays: [tue, fri]
    trigger: news_company_screen
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R3
  # EVERY WEDNESDAY, and the ONE events path (EVENTS_ANCHOR_DATE, the
  # every-other-week cadence and the separate "one reminder at T-20" lane are
  # all retired).
  #
  # REBUILT 14 Oct 2026: THREE LINES IN THE WHOLE POST, in up to three labelled
  # blocks, numbered straight through, rendered in code (wording.events_post):
  #   A  We have registered for these events and they are coming up soon:
  #   B  Registration closes soon for these events:
  #   C  Events not in the sheet, but worth looking at:
  # A block with nobody in it does not appear, heading included.
  #
  # PER ROW of the AI Events & Summits tab (Event, Location, Date, Last day for
  # registration, Registered, Link; Attended is not read), with a window of
  # EVENTS_WINDOW_DAYS (14):
  #   the END date has passed          never mentioned
  #   started, not finished            kept; the line says "started Tuesday"
  #   registered, starts within 14d    block A
  #   registered, further out          not mentioned
  #   not registered, deadline ahead   block B when the deadline OR the start is
  #                                    within 14d, with the close date
  #   not registered, deadline passed  skipped, logged "registration closed"
  #   not registered, NO USABLE        SKIPPED and logged (blank, "not
  #   deadline                         available", "TBD", anything unreadable)
  #   date unreadable                  skipped and logged; no line at all
  #   date with no year                the next occurrence, and the line says so
  #
  # THE "no registration deadline on the sheet" LINE AND THE "date unclear" LINE
  # ARE GONE. Most rows have no usable deadline, so blocks A and B are usually
  # empty and the post is suggestions. That is the rule working. What brings
  # block B back is the deadline backfill below, and people filling the cell in.
  #
  # THE SHEET GETS FIRST CALL on the three lines (max_items_per_post), closing
  # registrations first (by close date), then registered events (by start),
  # ties in sheet order. SUGGESTIONS FILL WHATEVER IS LEFT: events the tab
  # lacks, ONLY in EVENTS_SUGGEST_LOCATIONS (Bangalore, Karnataka, London),
  # each line a link. No "+N more" line and no rotation.
  #
  # It closes with "Shall I remind you again on Monday?" ("tomorrow" when
  # something listed falls before Monday), with "Want me to add any of these to
  # the GTM Playbook? And ..." in front when block C has something. A yes to
  # the reminder schedules one for EVENTS_REMIND_AGAIN_WEEKDAY at 14:00 in the
  # channel, listing those events, outside the cap. A yes to adding appends the
  # suggested rows; nothing is added without one, and a no is final. The
  # deadline backfill still runs, and still asks before writing a cell.
  - id: R3
    name: AI events and summits
    plain: AI events and summits coming up
    # The Bot Rules tab, rule 3, column "What the Bot Shares / Checks".
    sheet_wording: >-
      AI events and summits. Every Wednesday, three lines in total: the
      events we're registered for that start in the next 14 days; the
      ones we haven't registered for whose registration is closing; and
      events not on the sheet that are worth adding, filling whatever
      room is left, from Bangalore, Karnataka or London. Rows with no
      registration deadline are not listed, and neither is an event
      that has ended or whose registration has closed. Ends by offering
      to remind you again on Monday (or tomorrow if something is before
      Monday), and to add the new events: nothing is added without a
      yes. A reminder doesn't count toward the 7 posts a day.
    weekdays: [wed]
    trigger: events
    max_items_per_post: 3
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R4
  # EVERY OPEN P1 ON THE DELIVERABLES CHECKLIST, WHATEVER ITS DATE (rebuilt
  # 12 Oct 2026). MONDAY ONLY: the Sunday exception is gone.
  #
  # TWO CONDITIONS, NOTHING ELSE: Priority is exactly P1
  # (DELIVERABLE_P1_MARKERS) and Status is not exactly Completed
  # (DELIVERABLE_DONE_MARKERS; blank counts as open). NO DEADLINE WINDOW: a P1
  # due in December is listed today. ONE THING DROPS A ROW: its Status becomes
  # Completed. Nothing ages out and nothing rotates, so the list grows.
  # Each row skipped for its priority is logged with it; a Status that looks
  # finished and is not "Completed" ("Done", "Closed") is logged and STAYS.
  # Each item is:
  #     1. <Action Item, as the sheet spells it>
  #        Team: <Functional Dependency, or DELIVERABLE_DEFAULT_OWNER if blank>
  #        Due: Mon 14 Sep        (or: There's no deadline for this)
  # EARLIEST DEADLINE FIRST, no deadline last, a tie in sheet order. NO OVERDUE
  # COUNT, NO LINK, NO CLOSING LINE (nothing writes to this tab, so nothing is
  # promised). The same Action Item appears once. No remarks, no status. No
  # open P1 means no message. The same on a real day, a test day and a
  # simulation: one selection (nextaction._r_deliverables), one renderer
  # (drip.render_deliverables), one sender.
  #
  # counts_toward_cap: true, deliberately: a checklist is not time-critical and
  # must not crowd out a meeting post.
  - id: R4
    name: Deliverables checklist
    plain: every open P1 deliverable — title, team and due date
    description: every open P1 deliverable — title, team and due date
    # The Bot Rules tab, rule 4, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Every open P1 deliverable — title, team and due date. Checks the
      Deliverables Checklist for rows whose Priority is P1 and whose
      Status is not Completed, whatever the Tentative Deadline. Shares
      one post every Monday: a numbered list, earliest deadline first,
      where each item is its Action Item, then "Team: <Functional
      Dependency>" (the default owner when that is blank), then "Due:
      <day date>", or "There's no deadline for this" when the row has
      none. No overdue count, no link and no closing question. The same
      Action Item appears once. An item leaves the list only when its
      Status is set to Completed; nothing drops off with time. Past 20
      items the post says how many more are on the tab. P2 and P3 items
      are never mentioned. If no P1 is open, nothing is posted. Nothing
      is posted on Sunday.
    weekdays: [mon]
    trigger: deliverables
    # Every open P1 in ONE Monday post, grouped by rule (not by team), in
    # numbered points, twenty at most and one line for the rest; a list past 2000 characters is split between
    # lines into consecutive messages that count as one slot.
    max_items_per_post: 20
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R13
  # NEXT STEPS FOR CONNECTED CONTACTS (added by Vaishnavi, 7 Oct 2026;
  # REBUILT AS A REMINDER on 12 Oct 2026).
  #
  # LISTED HERE, BEFORE R5, ON PURPOSE. One contact is named once a day and the
  # earlier rule keeps them; R13 names 5 people and R5 would otherwise claim
  # them first.
  #
  # IT IS A REMINDER. It says what needs doing and who for. It never names a
  # cell, never asks for anything to be filled in, never gives a date, and
  # Saley does not read replies to it: a "done" under the post gets nothing.
  #
  # WHO IS IN: every Outreach PoCs row whose "Sid - LI Addition" says Connected
  # (NEXT_STEP_CONNECTED_MARKERS). That is the only test: a row with NO LI
  # Connected Date is in, and is due straight away. Out: a stop marker in
  # Prospect Status or Deal Status, a Completed meeting (R9 takes over), a
  # meeting booked for today or later, a snooze.
  #
  # WHAT EACH PERSON IS REMINDED ABOUT, by Next Steps:
  #   blank / Research the PoC            research them
  #   Send email N, not marked sent       send that email
  #   Send email 1 or 2, marked sent      a week later: send the next email
  #   Send email 3, marked sent           nothing
  #   Reach by LI DM, DM not marked sent  nothing  <- THE ONE KNOWN GAP
  #   Reach by LI DM / Call the PoC,      call them: 7 days after the LI DM Date,
  #     LI DM Sent says sent              then every 3 days until day 21; with no
  #                                       LI DM Date, straight away
  #   ...LI DM Sent says Replied          set up a meeting
  #   the calls ran out                   they look unresponsive (once)
  #   free text                           skipped and logged; never guessed at
  # A blank date always means "due now". A missing date is never mentioned.
  #
  # THE ORDER, six tiers: who replied; calls due; the next email due; an email
  # not sent; research and blank; unresponsive. INSIDE A TIER, A ROTATION:
  # whoever was named least recently goes first (never-named people ahead of
  # everybody), then the OLDEST LI Connected Date, then R5's company score, and
  # rows with no date last in sheet order. The Priority column is read and not
  # used: the tiers are the priority.
  #
  # NOBODY IS DROPPED. People keep coming back in that order until their row
  # moves: the step changes, a meeting is booked or completed, or Prospect
  # Status or Deal Status takes the row out. (A three-week drop was agreed on
  # 12 Oct 2026 and reversed the same day; NEXT_STEP_DROP_AFTER_DAYS is
  # retired.) The unresponsive line therefore REPEATS, in its turn, until
  # somebody sets Prospect Status to Unresponsive, which is the action it names.
  #
  # SALEY ONLY REMINDS. The step block (Next Steps, the three email Sent/Date
  # pairs, LI DM Sent, LI DM Date) is locked against every write path by ROLE,
  # wherever those columns sit on the tab (RESTRICTED_COLUMN_ROLES).
  - id: R13
    name: Next steps for connected contacts
    plain: next steps for the people we're connected with
    # The Bot Rules tab, rule 13, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Next steps for the people we're connected with: a reminder. Monday
      to Friday at 3 PM, one post naming up to 5 people from the Outreach
      PoCs rows where Sid - LI Addition is Connected (an LI Connected Date
      is not needed), grouped by what needs doing: people who replied to
      the DM (set up a meeting), people to call, people whose first or
      second email went out over a week ago (time for the next one),
      people whose first, second or third email hasn't gone out, people
      to research, and people who look unresponsive after the calls. Each
      person is one line, name and company. Whoever has waited longest
      comes first, and inside each group the people take turns: whoever
      was named least recently is named next. Nobody is dropped: a person
      keeps coming back until their row moves, and the list moves when
      the sheet moves. Someone who looks unresponsive is named again in
      their turn until Prospect Status is set to Unresponsive. A booked
      meeting pauses a person; a Completed meeting ends it. Saley never
      fills these cells and does not reply to answers under the post.
      Doesn't count toward the 5 posts a day.
    weekdays: [mon, tue, wed, thu, fri]
    trigger: next_step_followups
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: false
    enabled: true

  # ---------------------------------------------------------------- R5
  # Outreach PoCs rows where First Contact is FALSE or blank, ONE COMPANY AT A
  # TIME (rebuilt 11 Oct 2026; it was two companies a week in sheet order).
  #
  # WHICH COMPANY. Every company with somebody left to contact is scored by six
  # rules that STACK, most important first: warm (2+ people there already have a
  # first contact), voice industry, AI lab, somebody UK-based, a keyword in a
  # title, a research paper link. An earlier rule outweighs all the later ones
  # together. A tie goes to the company with FEWER people left, then to sheet
  # order. A company matching nothing is queued last, never left out.
  #
  # IT IS HELD. The open company stays open until everybody there has a first
  # contact recorded, or a person says "move on" (which PAUSES it; it returns
  # when the next one is finished). Nothing else moves it.
  #
  # WHO. Seniority (PROSPECT_ROLE_ORDER), then how many of UK-based / keyword /
  # paper link a person carries, then sheet order. The top five, and THE SAME
  # FIVE every post until one of them is contacted. Nothing counts repeats and
  # nothing asks to skip anybody.
  #
  # EVERY such row the stop rules allow is read, not only the "active" ones,
  # which is what a never-contacted row is not.
  #
  # THE EMAIL. For each person named whose Email cell is blank the lookup still
  # runs (ONE search, kept only if the address is word for word in a snippet;
  # at most EMAIL_LOOKUP_MAX_PER_POST; cached RESEARCH_CACHE_DAYS), because R6
  # reads the same cache. R5's MESSAGE NO LONGER PRINTS IT and makes no offer to
  # write it: the agreed message has no place for it. R6 still does both.
  - id: R5
    name: Prospects to contact
    plain: people we haven't made first contact with
    # The Bot Rules tab, rule 5, column "What the Bot Shares / Checks".
    sheet_wording: >-
      People we haven't made first contact with, one company at a time.
      Tuesday and Thursday: the open company's top 5 people with no First
      Contact (unless the row is dead, won or lost), most senior first,
      and the same 5 each time until one is contacted. The company is
      chosen by priority: 2 or more people there already contacted, then
      voice AI, then AI labs, then anyone UK-based, a keyword in a title,
      a research paper link; on a tie the company with fewer people left,
      then sheet order. Says how many we have reached there and how many
      are left, offers to list the rest, and names the next company; reply
      "move on" to switch to it (the current one is paused, not dropped).
      On the month's last Tuesday or Thursday, if nobody there was
      contacted that month, it adds a line saying so.
    weekdays: [tue, thu]
    trigger: prospects
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R6
  # EMAIL CHECK: CONNECTED, NO DM YET (rebuilt 12 Oct 2026; RULES-OCT16, 16 Oct).
  #
  # THE POST IS THE EMAIL WORK (Vaishnavi, 16 Oct). Three columns: LI Connected
  # Date, LI DM Sent, Email id.
  #
  # WHO: LI DM Sent is BLANK, and an LI Connected Date LI_NO_DM_DAYS (3) or more
  # days old. NO LI CONNECTED DATE, NOT ELIGIBLE (LI_NO_DM_REQUIRE_DATE, logged
  # once). The whole tab is read, with the usual stop markers.
  #
  # THE ORDER IS A ROTATION: least recently named first (li_no_dm_mentions,
  # written after a real send), then the oldest connection. A person leaves the
  # list when their sheet email passes the checks or LI DM Sent is filled in.
  #
  # THE EMAIL WORK: an address on the sheet is checked (is it an address, can
  # its domain receive mail: a DNS MX lookup, no SMTP probe); a blank cell gets
  # ONE search, and an address is kept only if a snippet shows it word for word.
  #
  # THE POST, under "Email check: connected, no DM yet":
  #   (block 1, OFF: LI_NO_DM_SHOW_WITH_EMAIL)  Verified email on file, no DM yet:
  #   block 2, at most LI_NO_DM_EMAIL_NAMES_PER_POST (5) people in all:
  #     Found an email:                          the address and where it was found
  #     Email on the sheet cannot receive mail:  the address and the reason
  #     Couldn't find an email:                  name and company
  # A person whose email passes the checks is NOT NAMED. Nobody needs anything:
  # "Everyone connected has a working email on file." No line asks for a DM.
  #
  # THE ADD: the closing question appears only when an address was found and
  # EMAIL_WRITE_ALLOWED is true. An approver's yes writes the found address into
  # that person's Email cell, only if it is still blank.
  - id: R6
    name: LinkedIn connected, no DM
    plain: people connected on LinkedIn with no DM yet
    # The Bot Rules tab, rule 6, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Email check: connected, no DM yet. Tuesday and Friday: people on
      Outreach PoCs connected 3 days or more ago (an LI Connected Date is
      needed) whose LI DM Sent is blank, and whose email needs work. Up to
      5 names a post, in turn: "Found an email" (an address Saley found,
      with where), "Email on the sheet cannot receive mail" (the address
      and why) and "Couldn't find an email". Someone whose email on the
      sheet works is not named. Saley only adds a found email to the sheet
      after a yes, and only into a blank Email cell. When nobody needs
      anything it says "Everyone connected has a working email on file."
    weekdays: [tue, fri]
    trigger: li_no_dm
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R7
  # NO MEETING BOOKED YET: THE ESCALATION BEHIND RULE 13 (rebuilt 13 Oct 2026).
  # Rule 13 does the chasing: from a week after the DM it says "We need to call
  # these PoCs" every weekday. This rule says, on Mondays, that the chasing is
  # not working.
  #
  # (Until 13 Oct it handed every Connected person to Rule 13, and since 12 Oct
  # that was every DM'd row, so it ran each Monday and named nobody. At its old
  # 7 days it would also have fired on exactly Rule 13's call condition.)
  #
  # WHO: LI DM Sent says Sent (Replied is Rule 13's meeting line; blank is no
  # DM). An LI DM Date (no date, no lookup). Meeting Status blank or TBD
  # (DM_NO_MEETING_STATUS_OPEN). Then either NO Meeting Date and the DM is
  # DM_NO_MEETING_DAYS (21) or more days old, or A Meeting Date that sits
  # DM_NO_MEETING_BOOKED_GAP_DAYS (7) or more days after the DM.
  # OUT: Meeting Status Completed; Deal Status Won or Lost (and every other stop
  # marker, as for every rule); Deal Status ON HOLD, which stops THIS RULE ONLY
  # (DEAL_ON_HOLD_MARKERS is not a stop marker for the other twelve).
  #
  # THE POST, rendered in code (wording.dm_no_meeting_post), never composed: a
  # numbered list of name and company, then one line under it saying what they
  # have in common; the people with a late meeting in a second block with the
  # same numbering, each showing the meeting date. No day counts, no notes, no
  # cell names, no question. REPLIES ARE NOT READ.
  #
  # DM_NO_MEETING_MAX_CONTACTS (3) PEOPLE A POST, across both blocks. THE ORDER
  # IS A ROTATION: least recently named first (never named ahead of everybody),
  # then longest since the DM, then sheet order. NOBODY IS DROPPED on a timer;
  # a person stays until the sheet moves. Nothing is posted when nobody
  # qualifies.
  #
  # RULE 13 COMES FIRST. It is listed above this rule, so on a Monday anybody
  # Rule 13 names that day is skipped here and the next person moves up.
  - id: R7
    name: No meeting booked yet
    plain: people we DM'd who still have no meeting
    # The Bot Rules tab, rule 7, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Every Monday, second in the day's order: people we DM'd more than
      three weeks ago who still have no meeting, plus anyone whose meeting
      is booked more than a week after the DM. Three people a post, name
      and company only. Nobody is dropped: a person keeps coming round
      until the meeting is Completed or the deal is Won, Lost or On Hold.
      Rule 13 comes first: anyone it names that day is not listed here.
    weekdays: [mon]
    trigger: dm_no_meeting
    max_items_per_post: 3
    destination: channel
    counts_toward_cap: true
    # off since 16 Oct by decision; R13 owns the chase
    enabled: false

  # ---------------------------------------------------------------- R8
  # REBUILT 12 Oct 2026. ANCHORED TO THE MEETING, NOT TO A WEEKDAY — hence the
  # empty weekday list — and it runs on Saturdays and Sundays too.
  #
  # ONE COLUMN IS READ: Meeting Date on Outreach PoCs, on every row that has
  # one. No activation gate, no Meeting Status: a Completed or cancelled
  # meeting with a date still to come is chased (accepted 12 Oct).
  #
  # THREE TOUCHES, TWO POSTS. Today's meetings at MEETING_DAYOF_TIME (10:00),
  # always on their own ("Meeting today"). The 3-day block and then the 5-day
  # block after MEETING_PREP_TIME (14:00), in one post ("Meeting
  # preparation"). 7, 6, 4, 2 or 1 days out: nothing that day.
  #
  # RENDERED IN CODE (wording.meeting_today_post / meeting_prep_post), with a
  # news line from what R1 has already stored. No search and no model call.
  #
  # NO CAP: every meeting is named, and a post too long for one Discord
  # message is split. `max_items_per_post` is required by the loader and is
  # NOT applied to this rule.
  #
  # counts_toward_cap: false — a meeting is time-critical and must not be
  # crowded out by a Monday chase. Outside daily_order and the 2-hour gap.
  # Never held by the re-ask clock: each touch belongs to one date and goes
  # out once (db.meeting_touches).
  - id: R8
    name: Meeting preparation
    plain: meetings coming up that need prep
    # The Bot Rules tab, rule 8, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Meetings coming up that need prep. Reads the Meeting Date on Outreach
      PoCs and nothing else. Three touches for each meeting: 5 days before, 3
      days before and on the day. Today's meetings post on their own at 10
      AM; the 3-day and 5-day ones post together after 2 PM. Both are outside
      the day's order, don't count toward the day's posts, and go out at
      weekends too. Every meeting is named, with the date and one recent
      news story on the company when there is one. Asks whether the deck,
      package and demo are ready, and offers a reminder.
    weekdays: []
    trigger: meeting_prep
    max_items_per_post: 50
    destination: channel
    counts_toward_cap: false
    enabled: true

  # ---------------------------------------------------------------- R9
  # ANCHORED TO THE MEETING. 3 days after a completed meeting with no next
  # steps, then every 3 days: one channel post, then two DMs, then one
  # escalation to Sid, then stop. Asks for next steps, the package discussed
  # and an estimated deal size.
  #
  # destination is "channel" because that is where the FIRST touch goes; the
  # engine escalates the later ones itself and records which stage each item is
  # at. See the DM note at the bottom of this file.
  #
  # THE LADDER CLIMBS ONE RUNG EACH TIME A FOLLOW-UP ACTUALLY GOES OUT (the
  # sender advances it, after the send) and STOPS after the last rung. It is
  # cleared when Notes/Remarks is filled or the meeting date changes, so the next
  # stalled meeting with the same contact starts at rung 1. Outside the daily
  # cap, and on its own clock: the re-ask clock does not apply.
  #
  # "NEXT STEPS" HERE MEANS THE NOTES COLUMN, "Notes/Remarks" (Vaishnavi, 7
  # Oct: "it means the next steps from notes; i've changed tht column name to
  # avoid confusion"). It never reads the Next Steps dropdown.
  - id: R9
    name: Meeting done, no next steps
    plain: meetings that happened with no next steps recorded
    # The Bot Rules tab, rule 9, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Meetings that happened with no next steps recorded. Checks Outreach PoCs
      for a completed meeting whose Notes/Remarks is blank. Asks 3 days after
      the meeting, then every 3 days, one step at a time: a channel post, then
      two DMs, then one escalation to Sid — and then stops. Asks for the next
      steps, the package discussed and an estimated deal size. Filling in
      Notes/Remarks ends it. Posts at 10 AM, outside the day's order, and
      doesn't count toward the 5 posts a day.
    weekdays: []
    trigger: meeting_followup
    max_items_per_post: 3
    destination: channel
    counts_toward_cap: false
    enabled: true

  # ---------------------------------------------------------------- R10
  # Prospect Status at a closure stage (CLOSURE_SUPPORT_STAGES, matched as whole
  # words: "No deal" is not a deal) AND Closure Prob% strictly above
  # CLOSURE_SUPPORT_MIN (50). Exactly 50 is EXCLUDED — "above 50" is the rule
  # as written, and a boundary a bot decides for itself is a boundary nobody
  # agreed to. A closure-stage row with NO percentage is left out silently.
  # Only active rows are read.
  #
  # REBUILT 13 Oct 2026. The post is rendered in code (wording.closure_post):
  #   These deals are in the closure stage:
  #   1. Ada Lovelace (Acme AI) — 70% at Quote
  #      In the news: [headline](link), 8 Oct
  # then one closing offer. Person first, company in brackets. One deal is
  # still a list of one.
  #
  # NO CAP AND NO ROTATION. Every qualifying deal is named every Monday,
  # HIGHEST PERCENTAGE FIRST (ties in sheet order): they are the deals closest
  # to landing and they stay in front of the team until they close.
  # `max_items_per_post` below is kept because the loader needs the field; it
  # is NOT applied to this rule (drip.shown_contacts).
  #
  # THE NEWS LINE COSTS NOTHING: it is read from what rule 1 has already
  # stored, one story a deal, the most important one for that company (full
  # name, never a substring), first seen since the last closure support post
  # (rule_last_posted, row 'R10'; the first run looks back
  # CLOSURE_NEWS_FIRST_RUN_DAYS). No story, no line.
  #
  # When Prospect Status (or Closure Prob%) is blank on EVERY active row the
  # rule cannot run, and says so in one line naming the empty column(s)
  # (wording.closure_empty_notice), EVERY MONDAY while that is so. When the
  # columns have values and no deal qualifies, it stays silent and the log
  # says why.
  - id: R10
    name: Closure support
    plain: deals close enough to push over the line
    # The Bot Rules tab, rule 10, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Every Monday: every deal whose Prospect Status is at a closure
      stage (deal / demo / quote) and whose Closure Prob% is above 50
      (50 itself doesn't count), highest first, with no cap. Each one
      shows the person, the company, the percentage and the stage, and
      any news about that company since the last closure support post.
      Ends by offering help. If Prospect Status or Closure Prob% is
      blank on every active row, posts one line saying so instead,
      every Monday until they are filled in. If the columns have values
      but no deal qualifies, stays silent.
    weekdays: [mon]
    trigger: closure_support
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R11
  # WEDNESDAYS ONLY since 8 Oct, first in the day's order. A company is noticed
  # the day it appears (the snapshot is taken on every run of the queue, every
  # sending day) and is asked about on the NEXT Wednesday that is at least
  # NEW_COMPANY_AFTER_WORKING_DAYS (1) working day after it appeared and no
  # more than NEW_COMPANY_WINDOW_DAYS (7) days after: exactly one Wednesday for
  # every company. max_items_per_post is 10, not 3: with a weekly post, a
  # company left out of this Wednesday's would be past the window by the next.
  #
  # One WORKING day after a company first appears in the Master Pipeline.
  # THERE IS NO CREATED-DATE COLUMN on that tab, so "appears" is detected by
  # comparing today's company names against a daily snapshot in SQLite. The
  # snapshot is taken by the caller, not by the engine, so the engine stays
  # pure — see nextaction.run's docstring.
  #
  # ASKS FIRST. Names the companies and asks whether to look for PoCs. No
  # web search until an approver says yes; then named people from the
  # company's own site and public profile links, each with its source.
  # Permission is asked again before anyone is added to Outreach PoCs.
  - id: R11
    name: New company in Master Pipeline
    plain: new companies in the pipeline — asks before looking up PoCs
    # The Bot Rules tab, rule 11, column "What the Bot Shares / Checks".
    sheet_wording: >-
      New companies in the Master Pipeline, every Wednesday, first in the
      day's order (2 PM): every company that appeared on the tab since last
      Wednesday's post, whatever day it appeared. Names them and asks
      whether to look for relevant PoCs; nothing is searched until an
      approver says yes, and nobody is added to Outreach PoCs without a
      separate yes. Up to 10 companies a post.
    weekdays: [wed]
    trigger: new_pipeline_company
    max_items_per_post: 10
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R12
  # Every package on the Sales Packages tab where Ready? is No or blank. Blank
  # reads as No — see gtm_sheet.ready_flag for why that direction and not the
  # other. The Sales Packages tab only: no Outreach PoCs row, no activation
  # gate, no cross-rule dedup.
  #
  # REDESIGNED 12 Oct 2026. The post is rendered in code (wording.packages_post):
  #   these Sales Packages aren't ready yet:
  #   1. <Package Name>
  #   (+N more next Thursday.)        only when more qualify than fit
  #   Could you let me know roughly when each might be ready?
  # NAMES ONLY, exactly as the sheet spells them: no status, no per cent. One
  # package is still a list. The name is a link when the product-doc cell holds
  # a real url.
  #
  # ORDER: PACKAGES_ORDER (completion_desc: highest % Completion first), a blank
  # per cent last, ties in sheet order. `max_items_per_post` below is the only
  # cap. Nothing drops on a clock and nothing rotates: a package leaves when
  # Ready? is Yes, silently. Nothing qualifying: no post.
  #
  # A DATE GIVEN IN A REPLY is recorded (PACKAGES_DATE_CAPTURE) as a one-off
  # reminder: on that day, if Ready? is still not Yes, one line; if it is Yes,
  # nothing; if the day is a Thursday, nothing, because the weekly post names
  # the package anyway.
  - id: R12
    name: Sales packages
    plain: sales packages that aren't ready yet
    weekdays: [thu]
    trigger: sales_packages
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: true
    enabled: true

  # ---------------------------------------------------------------- R14
  # THE RECONNECT FOLLOW-UP (NFT2-1086, 13 Oct 2026). ANCHORED, like R8 and R9:
  # no weekday, it runs on whatever day a person's date falls. In NO
  # daily_order list. It posts at RECONNECT_TIME (15:30, and only ever between
  # 14:00 and 16:00), outside the day's order, the 2-hour gap and the cap, in
  # the API SALES CHANNEL (SALES_API_CHANNEL_ID) and nowhere else: with that
  # unset or unreachable it posts nothing.
  #
  # ONE DAY A PERSON, the first of these that matches (reconnect.trigger_for):
  #   1  Reconnect Date holds a readable date     that date
  #   2  Reconnect Date empty or FALSE, and a
  #      Meeting Date                             Meeting Date + 45 days
  #   3  no Meeting Date either                   the newest of First Contact
  #                                               Date, LI Connected Date, LI DM
  #                                               Date and the three email dates,
  #                                               + 45 days
  # A row with no date in any of those columns never produces a message. Every
  # row with a company name is read: there is NO activation gate.
  #
  # A SATURDAY OR SUNDAY MOVES TO THE MONDAY. A day already gone is SKIPPED:
  # no catch-up, no backfill. IT FIRES ONCE A PERSON (the reconnect_fired
  # table); only a NEW Reconnect Date fires them again. Deal Status Lost or
  # On Hold: never. Named by R13 that day: not repeated here.
  #
  # THE POST (wording.reconnect_post) names `max_items_per_post` people,
  # numbered, "**Name** (Company)", and when more are due it ends "there are N
  # more — would you like to look at the rest?". A yes under THAT DAY'S post
  # lists everybody due that day, once. Anything else gets no reply. A
  # Reconnect Date nobody could read: the person is listed "(reconnect date
  # unclear)" on the day rule 2 or 3 gives them.
  #
  # LAST IN THE FILE ON PURPOSE: it reads who R13 has named today, so R13 must
  # have run. It takes no contact from any rule and gives way only to R13.
  #
  # `counts_toward_cap` is false and the code holds it there whatever this says
  # (drip.NEVER_COUNTED).
  - id: R14
    name: Reconnect follow-up
    plain: people it's time to get back in touch with
    # The Bot Rules tab, rule 14, column "What the Bot Shares / Checks".
    sheet_wording: >-
      Time to reconnect: on the day a person's Reconnect Date falls, one
      post at 3:30 PM in the API Sales channel naming up to 5 people, name
      and company. If Reconnect Date is empty the day is 45 days after the
      Meeting Date, and with no Meeting Date 45 days after the latest of
      First Contact Date, LI Connected Date, LI DM Date and the three
      email dates. A row with none of those dates is never mentioned. A
      day on a Saturday or Sunday moves to the Monday; a day already past
      is skipped. Each person is named once and never again unless a new
      Reconnect Date is written. Deal Status Lost or On Hold is never
      named. If more than 5 are due the post says how many more, and a
      yes under it lists them all. A Reconnect Date that can't be read is
      flagged "(reconnect date unclear)". Saley never fills this column.
      Doesn't count toward the 7 posts a day.
    weekdays: []
    trigger: reconnect
    max_items_per_post: 5
    destination: channel
    counts_toward_cap: false
    enabled: true

# =============================================================================
# THE DM NOTE
#
# R9 escalates to DMs after its first touch, and the strategy doc's escalation
# rule does the same for anything three or more days overdue. With
# SALES_DMS_ENABLED off, an item whose rung resolves to "dm" or "escalation" is
# still computed, still ranked and still shown in `cadence preview` — and it
# POSTS IN THE CHANNEL as an ordinary follow-up. The escalation rung posts in
# the channel ADDRESSED TO ESCALATION_ADDRESSEE (Sid).
#
# THE MESSAGE DOES NOT MENTION ANY OF THIS. It used to say "this would have
# been a DM", and that was the wrong thing to tell anybody: the reader does not
# care about the bot's delivery plumbing, and a nudge that spends a clause
# apologising for its own channel reads as a bot with a problem rather than a
# colleague with a question. The fallback is LOGGED instead —
# `[dm] fallback-to-channel rung=N item=...` — where an operator sees it and
# the team does not.
# =============================================================================
